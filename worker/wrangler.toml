# Cloudflare Worker behind the planner page: read-only ClickUp relay + plan storage.
# Deploy from this folder:
#   npx wrangler login
#   npx wrangler d1 execute humam-promotieplanner-plan --remote --file=schema.sql   # once
#   npx wrangler secret put CLICKUP_TOKEN        # paste a personal ClickUp API token (pk_…)
#   npx wrangler deploy                          # prints the https://….workers.dev URL
name = "humam-promotieplanner-auth"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# ClickUp list ids the relay may read (comma-separated).
ALLOWED_LIST_IDS = "901523821635"
# Page origins allowed to call this worker (no trailing slash, comma-separated).
ALLOWED_ORIGINS = "https://easyseebv.github.io,http://localhost:8765,http://127.0.0.1:8765"

# The weekly plan is stored here (see schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "humam-promotieplanner-plan"
database_id = "3ffa2376-12c4-4fc5-bdff-ca45cdb2b67a"

# CLICKUP_TOKEN is a secret and is NOT set here on purpose (see above).
